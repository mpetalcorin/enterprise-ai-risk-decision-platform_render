apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts
  namespace: enterprise-risk
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: enterprise-risk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/OWNER/enterprise-ai-risk-decision-platform:latest
          command: ["sh", "-c"]
          args:
            - >-
              mlflow server --host 0.0.0.0 --port 5000
              --backend-store-uri "$MLFLOW_DATABASE_URL"
              --serve-artifacts
              --artifacts-destination /app/mlartifacts
          envFrom:
            - secretRef:
                name: risk-api-secrets
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: artifacts
              mountPath: /app/mlartifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: enterprise-risk
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
