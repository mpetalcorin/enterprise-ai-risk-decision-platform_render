[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-risk-decision-platform"
version = "0.1.0"
description = "Production-grade reference platform for governed ML risk decisions with real-time and batch inference."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mark Ihrwell R. Petalcorin"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
  "torch>=2.4,<3",
  "shap>=0.46,<1",
  "joblib>=1.4,<2",
  "sqlalchemy>=2.0,<3",
  "psycopg2-binary>=2.9,<3",
  "prometheus-client>=0.21,<1",
  "mlflow>=3,<4",
  "python-json-logger>=2,<4",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3"
]

[project.scripts]
risk-platform = "risk_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]
