name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest --cov=risk_platform --cov-report=xml
      - run: python -m risk_platform.cli generate --rows 2000 --output data/ci.csv
      - run: python -m risk_platform.cli train --data data/ci.csv --backend xgboost --output models/risk_model.joblib
      - run: python -m risk_platform.cli drift --input data/ci.csv --model models/risk_model.joblib --output reports/ci_drift.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: enterprise-ai-risk-decision-platform:ci
